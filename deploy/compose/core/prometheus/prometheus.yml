global:
  scrape_interval:     15s # Как часто собирать метрики
  evaluation_interval: 15s # Как часто вычислять правила агрегации и алертинга

scrape_configs:
  # Собираем метрики самого Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: [ "localhost:9090" ]

  # Собираем метрики OpenTelemetry Collector'а (для мониторинга самого коллектора)
  - job_name: "otel-collector"
    static_configs:
      - targets: [ "otel-collector:8888" ]

  # Собираем метрики Order Service
  - job_name: "order-service"
    static_configs:
      - targets: [ "order:8080" ]
    metrics_path: /metrics
    scrape_interval: 5s

  # Собираем метрики Assembly Service
  - job_name: "assembly-service"
    static_configs:
      - targets: [ "assembly:8081" ]
    metrics_path: /metrics
    scrape_interval: 5s